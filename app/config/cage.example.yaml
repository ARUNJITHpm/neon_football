  roof_height_m: null
  ball_diameter_m: null
cameras: []
capture:
  enabled: false
  root: data/recordings
  ffmpeg: ffmpeg
sensors: []
operations:
  min_free_bytes: 1073741824
  integrity_interval_seconds: 30
